name: CI

# Run the test suite on every push and pull request. Tests reach only the
# bundled server on loopback: a fixture in tests/conftest.py fails any test
# that resolves a name or connects anywhere else. The demo then runs for real,
# over the network stack and the wall clock, still on 127.0.0.1 only.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      # Actions are pinned to commit SHAs (not tags) so a moved tag cannot
      # change what runs here. The comment records the human-readable version.
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e . --no-deps

      - name: Run the tests
        run: pytest

      - name: Run the demo
        run: rate-limit-probe demo
